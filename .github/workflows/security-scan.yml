name: Security Scan

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy FS (Vuln & Secret)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          skip-dirs: docs/debugging,helm-releases,helm,internal/event/target/testdata
          skip-files: .github/workflows/root.key,internal/config/lambda/event/event.go
          severity: HIGH,CRITICAL
          exit-code: '1'

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: >-
          semgrep scan
          --config p/security-audit
          --config p/secrets
          --config p/owasp-top-ten
          --exclude-rule go.lang.security.filepath-clean-misuse.filepath-clean-misuse
          --exclude internal/config/lambda/event/event.go
          --exclude '**/testdata/**'
          --severity ERROR
          --error
          cmd internal
