name: Publish Docker image

# Builds the PATCHED MinIO fork from source (Dockerfile.ghcr) and pushes a
# multi-arch image to:
#   - GitHub Container Registry: ghcr.io/<owner>/minio   (always)
#   - Docker Hub: docker.io/<DOCKERHUB_USERNAME>/minio    (only if the
#     DOCKERHUB_USERNAME + DOCKERHUB_TOKEN repo secrets are set)
#
# Visibility:
#   - GHCR: a new package is PRIVATE until the owner flips it to Public in the
#     package settings (GitHub has no API for this).
#   - Docker Hub: the job calls the Hub API to set the repo Public after push,
#     so it is public-by-command with no UI step.

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history for commit time + sha

      - name: Compute version from HEAD commit
        id: ver
        run: |
          set -euo pipefail
          COMMIT_TIME="$(git log -n1 --format=%cI HEAD)"
          REL="$(date -u -d "$COMMIT_TIME" +%Y-%m-%dT%H-%M-%SZ)"
          VERSION="$(date -u -d "$COMMIT_TIME" +%Y-%m-%dT%H:%M:%SZ)"
          YEAR="$(date -u -d "$COMMIT_TIME" +%Y)"
          FULL="$(git rev-parse HEAD)"
          SHORT="$(git rev-parse --short HEAD)"
          SHORT12="$(git rev-parse HEAD | cut -c1-12)"
          TAG="RELEASE.${REL}.hotfix.${SHORT}"
          {
            echo "release_tag=${TAG}"
            echo "version=${VERSION}"
            echo "year=${YEAR}"
            echo "commit=${FULL}"
            echo "short=${SHORT}"
            echo "short12=${SHORT12}"
          } >> "$GITHUB_OUTPUT"
          echo "Image version: ${TAG}"

      - name: Compose image tags
        id: tags
        run: |
          set -euo pipefail
          GHCR="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          REL='${{ steps.ver.outputs.release_tag }}'
          SHORT='${{ steps.ver.outputs.short }}'
          LIST="${GHCR}:latest
          ${GHCR}:${REL}
          ${GHCR}:sha-${SHORT}"
          if [ -n "${DOCKERHUB_USERNAME:-}" ]; then
            DH="docker.io/${DOCKERHUB_USERNAME}/minio"
            LIST="${LIST}
          ${DH}:latest
          ${DH}:${REL}
          ${DH}:sha-${SHORT}"
          fi
          {
            echo "list<<EOF"
            echo "${LIST}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Tags:"; echo "${LIST}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ghcr
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            RELEASE=${{ steps.ver.outputs.release_tag }}
            COMMIT_ID=${{ steps.ver.outputs.commit }}
            SHORT_COMMIT_ID=${{ steps.ver.outputs.short12 }}
            COPYRIGHT_YEAR=${{ steps.ver.outputs.year }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set Docker Hub visibility and description
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          JWT="$(curl -s -H 'Content-Type: application/json' -X POST \
            -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r '.token // empty')"
          if [ -z "$JWT" ]; then
            echo "::warning::Could not authenticate to Docker Hub API; repo metadata not changed (push still succeeded)."
            exit 0
          fi
          SHORT_DESC="Hardened MinIO fork — S3-compatible storage with backported security fixes (ANBM re-audit)."
          FULL_DESC="$(cat dockerscripts/DOCKERHUB.md)"
          BODY="$(jq -n --arg d "$SHORT_DESC" --arg f "$FULL_DESC" \
            '{is_private:false, description:$d, full_description:$f}')"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' -X PATCH \
            -H "Authorization: JWT ${JWT}" -H 'Content-Type: application/json' \
            -d "$BODY" \
            "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/minio/")"
          echo "Set repo public + description -> HTTP ${CODE}"

      - name: Summary
        run: |
          {
            echo "### Docker image published"
            echo ""
            echo "Version: \`${{ steps.ver.outputs.release_tag }}\` · platforms linux/amd64, linux/arm64"
            echo ""
            echo '```'
            echo "${{ steps.tags.outputs.list }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
